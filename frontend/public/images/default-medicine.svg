<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-def" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="med-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="med-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-def)"/>

  <!-- Center Pharmacy Shield & Cross -->
  <g filter="url(#shadow)" transform="translate(100, 25)">
    <!-- White Shield -->
    <path d="M 60,10 L 110,25 L 110,80 C 110,115 60,145 60,145 C 60,145 10,115 10,80 L 10,25 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Green Border Inner Shield -->
    <path d="M 60,18 L 102,31 L 102,78 C 102,108 60,134 60,134 C 60,134 18,108 18,78 L 18,31 Z" fill="url(#med-teal)"/>

    <!-- Bright White Pharmacy Cross -->
    <rect x="52" y="44" width="16" height="48" rx="4" fill="#ffffff"/>
    <rect x="36" y="60" width="48" height="16" rx="4" fill="#ffffff"/>

    <!-- Sparkle on Cross -->
    <circle cx="60" cy="68" r="4" fill="#a7f3d0"/>
  </g>

  <!-- Left Floating Pill -->
  <g filter="url(#shadow)" transform="translate(35, 75) rotate(-25)">
    <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Floating Capsule -->
  <g filter="url(#shadow)" transform="translate(225, 70) rotate(30)">
    <rect x="0" y="0" width="22" height="44" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 0,0 L 22,0 C 22,0 22,22 22,22 L 0,22 Z" fill="url(#med-blue)"/>
  </g>
</svg>
