<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cap-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cap-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cap-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bottle-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-cap)"/>

  <!-- Medicine Bottle -->
  <g filter="url(#shadow)" transform="translate(60, 30)">
    <!-- Cap -->
    <rect x="25" y="0" width="50" height="15" rx="3" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
    <!-- Neck -->
    <rect x="30" y="15" width="40" height="10" fill="#e2e8f0"/>
    <!-- Bottle body -->
    <rect x="10" y="25" width="80" height="110" rx="12" fill="url(#bottle-body)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="15" y="45" width="70" height="65" rx="6" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1"/>
    <!-- Rx emblem on label -->
    <circle cx="50" cy="72" r="14" fill="#0284c7"/>
    <path d="M45 68 L52 68 C55 68 56 70 56 72 C56 74 55 76 52 76 L45 76 Z M48 76 L55 83 M51 78 L56 78" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <rect x="25" y="93" width="50" height="4" rx="2" fill="#94a3b8"/>
    <rect x="32" y="100" width="36" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>

  <!-- Large Floating Capsule 1 (Red & White) -->
  <g filter="url(#shadow)" transform="translate(160, 50) rotate(-35)">
    <!-- White Half -->
    <path d="M 0,16 C 0,7.16 7.16,0 16,0 L 40,0 L 40,32 L 16,32 C 7.16,32 0,24.84 0,16 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Red Half -->
    <path d="M 40,0 L 64,0 C 72.84,0 80,7.16 80,16 C 80,24.84 72.84,32 64,32 L 40,32 Z" fill="url(#cap-red)" stroke="#b91c1c" stroke-width="1"/>
    <!-- Divider Band -->
    <rect x="38" y="-1" width="4" height="34" rx="1" fill="#ffffff" opacity="0.9"/>
    <!-- Capsule Gloss Shine -->
    <ellipse cx="25" cy="8" rx="14" ry="3" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="60" cy="8" rx="12" ry="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Large Floating Capsule 2 (Blue & Yellow) -->
  <g filter="url(#shadow)" transform="translate(195, 120) rotate(25)">
    <!-- Blue Half -->
    <path d="M 0,14 C 0,6.27 6.27,0 14,0 L 36,0 L 36,28 L 14,28 C 6.27,28 0,21.73 0,14 Z" fill="url(#cap-blue)" stroke="#0369a1" stroke-width="1"/>
    <!-- Yellow Half -->
    <path d="M 36,0 L 58,0 C 65.73,0 72,6.27 72,14 C 72,21.73 65.73,28 58,28 L 36,28 Z" fill="url(#cap-yellow)" stroke="#ca8a04" stroke-width="1"/>
    <rect x="34" y="-1" width="4" height="30" rx="1" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="20" cy="7" rx="10" ry="2.5" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="50" cy="7" rx="10" ry="2.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Sparkles -->
  <path d="M280 40 L282 45 L287 47 L282 49 L280 54 L278 49 L273 47 L278 45 Z" fill="#0284c7" opacity="0.7"/>
  <path d="M40 140 L42 144 L46 146 L42 148 L40 152 L38 148 L34 146 L38 144 Z" fill="#eab308" opacity="0.7"/>
</svg>
