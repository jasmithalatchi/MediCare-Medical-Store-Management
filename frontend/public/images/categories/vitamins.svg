<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="vit-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="vit-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-vit)"/>

  <!-- Sun Rays Background Accent -->
  <g transform="translate(160, 100)" opacity="0.15">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#eab308" stroke-width="4" stroke-dasharray="10,15"/>
  </g>

  <!-- Vitamin White Tub Bottle -->
  <g filter="url(#shadow)" transform="translate(60, 25)">
    <!-- Yellow Flip Cap -->
    <rect x="25" y="0" width="50" height="16" rx="4" fill="url(#vit-gold)" stroke="#ca8a04" stroke-width="1"/>

    <!-- Bottle Neck -->
    <rect x="30" y="16" width="40" height="10" fill="#e2e8f0"/>

    <!-- Bottle Body -->
    <rect x="10" y="26" width="80" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Bright Label -->
    <rect x="15" y="46" width="70" height="75" rx="6" fill="#fef08a" fill-opacity="0.5" stroke="#fde047" stroke-width="1"/>

    <!-- Vitamin C / D Sun Badge -->
    <circle cx="50" cy="74" r="18" fill="url(#vit-orange)"/>
    <text x="50" y="80" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>

    <rect x="25" y="98" width="50" height="4" rx="2" fill="#334155"/>
    <rect x="30" y="106" width="40" height="3" rx="1.5" fill="#ca8a04"/>
    <rect x="35" y="112" width="30" height="2.5" rx="1" fill="#94a3b8"/>
  </g>

  <!-- Floating Vitamin Softgels & Tablets -->
  <g filter="url(#shadow)" transform="translate(175, 45)">
    <!-- Translucent Golden Softgel 1 -->
    <ellipse cx="40" cy="30" rx="20" ry="14" fill="url(#vit-gold)" stroke="#ca8a04" stroke-width="1" transform="rotate(-25 40 30)"/>
    <ellipse cx="36" cy="26" rx="8" ry="4" fill="#ffffff" opacity="0.8" transform="rotate(-25 36 26)"/>

    <!-- Vitamin Molecule B-Complex Badge -->
    <circle cx="85" cy="70" r="22" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    <text x="85" y="76" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">D3</text>

    <!-- Translucent Orange Gummy / Tablet -->
    <circle cx="35" cy="95" r="18" fill="url(#vit-orange)" stroke="#c2410c" stroke-width="1"/>
    <text x="35" y="100.5" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">B12</text>

    <!-- Small Golden Bead Softgel -->
    <circle cx="75" cy="120" r="14" fill="url(#vit-gold)" stroke="#ca8a04" stroke-width="1"/>
    <ellipse cx="71" cy="116" rx="5" ry="3" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Sparkles -->
  <path d="M 270,30 L 273,36 L 279,38 L 273,40 L 270,46 L 267,40 L 261,38 L 267,36 Z" fill="#eab308" opacity="0.9"/>
  <path d="M 40,75 L 42,79 L 46,81 L 42,83 L 40,87 L 38,83 L 34,81 L 38,79 Z" fill="#f97316" opacity="0.8"/>
</svg>
