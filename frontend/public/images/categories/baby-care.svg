<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-baby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="pastel-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="baby-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-baby)"/>

  <!-- Baby Feeding Bottle Left -->
  <g filter="url(#shadow)" transform="translate(65, 20)">
    <!-- Silicone Teat Nipple -->
    <path d="M 38,0 C 35,0 32,8 30,15 L 46,15 C 44,8 41,0 38,0 Z" fill="#fed7aa" opacity="0.9"/>

    <!-- Collar Ring -->
    <rect x="22" y="15" width="32" height="12" rx="3" fill="url(#pastel-pink)"/>

    <!-- Clear Bottle Body -->
    <rect x="12" y="27" width="52" height="125" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" opacity="0.95"/>

    <!-- Milk Liquid inside -->
    <rect x="16" y="60" width="44" height="88" rx="8" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Graduation markings -->
    <line x1="16" y1="70" x2="26" y2="70" stroke="#fda4af" stroke-width="1.5"/>
    <line x1="16" y1="85" x2="32" y2="85" stroke="#fda4af" stroke-width="2"/>
    <line x1="16" y1="100" x2="26" y2="100" stroke="#fda4af" stroke-width="1.5"/>
    <line x1="16" y1="115" x2="32" y2="115" stroke="#fda4af" stroke-width="2"/>
    <line x1="16" y1="130" x2="26" y2="130" stroke="#fda4af" stroke-width="1.5"/>

    <!-- Cute Heart Badge on Bottle -->
    <circle cx="44" cy="95" r="10" fill="#ffe4e6"/>
    <path d="M 44,92 C 44,90 41,88 39,90 C 36,92 37,96 44,101 C 51,96 52,92 49,90 C 47,88 44,90 44,92 Z" fill="#f43f5e"/>
  </g>

  <!-- Cute Pacifier Soother in Foreground Right -->
  <g filter="url(#shadow)" transform="translate(170, 75)">
    <!-- Pacifier Handle Ring -->
    <ellipse cx="65" cy="45" rx="18" ry="24" fill="none" stroke="url(#baby-blue)" stroke-width="6"/>

    <!-- Shield Plate -->
    <ellipse cx="38" cy="45" rx="28" ry="20" fill="url(#pastel-pink)" stroke="#e11d48" stroke-width="1.2"/>
    <!-- Ventilation holes on shield -->
    <circle cx="22" cy="45" r="4" fill="#ffffff"/>
    <circle cx="54" cy="45" r="4" fill="#ffffff"/>

    <!-- Button Center -->
    <circle cx="38" cy="45" r="10" fill="#ffffff"/>
    <circle cx="38" cy="45" r="6" fill="#f43f5e"/>

    <!-- Soft Silicone Teat -->
    <ellipse cx="6" cy="45" rx="12" ry="10" fill="#fed7aa" opacity="0.85"/>
  </g>

  <!-- Baby Gentle Care Stars / Hearts -->
  <path d="M 265,35 C 265,35 261,31 257,35 C 253,39 255,44 265,52 C 275,44 277,39 273,35 C 269,31 265,35 265,35 Z" fill="#f43f5e" opacity="0.5"/>
  <path d="M 35,130 C 35,130 32,127 29,130 C 26,133 27,137 35,143 C 43,137 44,133 41,130 C 38,127 35,130 35,130 Z" fill="#38bdf8" opacity="0.6"/>
</svg>
