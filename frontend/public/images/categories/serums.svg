<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="serum-liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-ser)"/>

  <!-- Dropper Bottle Group -->
  <g filter="url(#shadow)" transform="translate(110, 15)">
    <!-- Rubber Bulb -->
    <path d="M 40,0 C 32,0 30,12 30,18 L 54,18 C 54,12 52,0 44,0 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Gold Dropper Cap Ring -->
    <rect x="25" y="18" width="34" height="12" rx="2" fill="url(#gold-rim)" stroke="#ca8a04" stroke-width="1"/>
    <rect x="23" y="30" width="38" height="6" rx="1.5" fill="url(#gold-rim)"/>

    <!-- Glass Bottle Body -->
    <rect x="12" y="36" width="60" height="125" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Serum Liquid inside -->
    <rect x="16" y="70" width="52" height="87" rx="6" fill="url(#serum-liquid)" opacity="0.85"/>
    <ellipse cx="42" cy="70" rx="26" ry="6" fill="#fde047" opacity="0.6"/>

    <!-- Minimalist Cosmetic Label -->
    <rect x="18" y="78" width="48" height="65" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Minimalist lines on label -->
    <circle cx="42" cy="94" r="8" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.2"/>
    <text x="42" y="97" font-family="sans-serif" font-size="8" font-weight="bold" fill="#7e22ce" text-anchor="middle">10%</text>
    <rect x="26" y="108" width="32" height="3" rx="1" fill="#334155"/>
    <rect x="30" y="114" width="24" height="2.5" rx="1" fill="#94a3b8"/>
    <rect x="33" y="120" width="18" height="2" rx="1" fill="#cbd5e1"/>

    <!-- Glass shine -->
    <path d="M 18,45 L 22,45 L 22,150 L 18,145 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Large Glass Pipette in Foreground Right -->
  <g filter="url(#shadow)" transform="translate(195, 40) rotate(15)">
    <!-- Glass tube -->
    <rect x="15" y="10" width="12" height="90" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" opacity="0.9"/>
    <!-- Liquid inside pipette -->
    <rect x="17" y="35" width="8" height="65" fill="url(#serum-liquid)"/>
    <!-- Pipette tapered tip -->
    <polygon points="15,100 27,100 23,120 19,120" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="17,100 25,100 22,118 20,118" fill="url(#serum-liquid)"/>

    <!-- Golden Droplet Suspended -->
    <path d="M 21,126 C 21,126 13,138 13,145 C 13,150 17,154 21,154 C 25,154 29,150 29,145 C 29,138 21,126 21,126 Z" fill="url(#serum-liquid)"/>
    <ellipse cx="19" cy="144" rx="2.5" ry="4" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Golden Radiance Sparkles -->
  <path d="M 70,70 L 73,76 L 80,78 L 73,80 L 70,86 L 67,80 L 60,78 L 67,76 Z" fill="#eab308" opacity="0.8"/>
  <path d="M 270,120 L 272,124 L 277,126 L 272,128 L 270,132 L 268,128 L 263,126 L 268,124 Z" fill="#a855f7" opacity="0.7"/>
</svg>
