<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-inj" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="vial-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="vial-fluid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-inj)"/>

  <!-- Sterile Glass Vaccine Vial Left -->
  <g filter="url(#shadow)" transform="translate(60, 45)">
    <!-- Aluminum Crimp & Flip Cap -->
    <rect x="25" y="0" width="30" height="8" rx="2" fill="url(#vial-cap)"/>
    <rect x="28" y="8" width="24" height="6" fill="#94a3b8"/>

    <!-- Glass Neck -->
    <rect x="30" y="14" width="20" height="8" fill="#e2e8f0"/>

    <!-- Vial Shoulder & Body -->
    <rect x="15" y="22" width="50" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Sterile Fluid inside -->
    <rect x="18" y="55" width="44" height="58" rx="5" fill="url(#vial-fluid)"/>

    <!-- Clinical Label -->
    <rect x="20" y="40" width="40" height="50" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="24" y="48" width="32" height="4" rx="2" fill="#0284c7"/>
    <rect x="26" y="56" width="28" height="3" rx="1.5" fill="#64748b"/>
    <rect x="28" y="62" width="24" height="2.5" rx="1" fill="#94a3b8"/>
    <rect x="25" y="74" width="30" height="8" rx="2" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8"/>
    <text x="40" y="80.5" font-family="sans-serif" font-size="6" font-weight="bold" fill="#047857" text-anchor="middle">1g IV/IM</text>
  </g>

  <!-- Calibrated Syringe Right -->
  <g filter="url(#shadow)" transform="translate(150, 40) rotate(-40)">
    <!-- Needle Hub & Metal Needle -->
    <line x1="12" y1="-35" x2="12" y2="0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <polygon points="6,0 18,0 15,12 9,12" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>

    <!-- Syringe Barrel -->
    <rect x="0" y="12" width="24" height="110" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.95"/>

    <!-- Liquid inside syringe -->
    <rect x="3" y="14" width="18" height="55" fill="url(#vial-fluid)"/>

    <!-- Graduation Marks -->
    <line x1="2" y1="25" x2="8" y2="25" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="2" y1="35" x2="12" y2="35" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="2" y1="45" x2="8" y2="45" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="2" y1="55" x2="12" y2="55" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="2" y1="65" x2="8" y2="65" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Rubber Plunger Head -->
    <rect x="2" y="69" width="20" height="12" rx="2" fill="#334155"/>
    <!-- Plunger Rod -->
    <rect x="10" y="81" width="4" height="65" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Thumb Rest -->
    <ellipse cx="12" cy="146" rx="14" ry="4" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
    <!-- Finger Flange on Barrel -->
    <rect x="-8" y="118" width="40" height="6" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Clean Sparkle Elements -->
  <path d="M 280,35 L 282,40 L 287,42 L 282,44 L 280,49 L 278,44 L 273,42 L 278,40 Z" fill="#0284c7" opacity="0.7"/>
</svg>
