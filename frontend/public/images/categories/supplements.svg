<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="protein-tub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-sup)"/>

  <!-- Protein Nutrition Tub Left -->
  <g filter="url(#shadow)" transform="translate(60, 20)">
    <!-- Ridged Lid -->
    <rect x="15" y="0" width="80" height="20" rx="4" fill="#0f172a" stroke="#020617" stroke-width="1.2"/>
    <line x1="25" y1="5" x2="25" y2="15" stroke="#475569" stroke-width="1.5"/>
    <line x1="35" y1="5" x2="35" y2="15" stroke="#475569" stroke-width="1.5"/>
    <line x1="45" y1="5" x2="45" y2="15" stroke="#475569" stroke-width="1.5"/>
    <line x1="55" y1="5" x2="55" y2="15" stroke="#475569" stroke-width="1.5"/>
    <line x1="65" y1="5" x2="65" y2="15" stroke="#475569" stroke-width="1.5"/>
    <line x1="75" y1="5" x2="75" y2="15" stroke="#475569" stroke-width="1.5"/>
    <line x1="85" y1="5" x2="85" y2="15" stroke="#475569" stroke-width="1.5"/>

    <!-- Tub Shoulder & Main Body -->
    <path d="M 15,20 L 5,35 L 5,145 C 5,155 15,160 25,160 L 85,160 C 95,160 105,155 105,145 L 105,35 L 95,20 Z" fill="url(#protein-tub)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Dynamic Label on Tub -->
    <rect x="12" y="45" width="86" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Golden Shield Crest -->
    <polygon points="55,55 70,60 70,78 55,88 40,78 40,60" fill="url(#gold-badge)"/>
    <text x="55" y="75" font-family="sans-serif" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">100%</text>

    <text x="55" y="100" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">WHEY ISOLATE</text>
    <rect x="25" y="108" width="60" height="4" rx="2" fill="#ef4444"/>
    <text x="55" y="122" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#94a3b8" text-anchor="middle">24G PROTEIN • 5.5G BCAA</text>

    <!-- Gloss highlight -->
    <path d="M 12,38 L 18,38 L 18,150 L 12,145 Z" fill="#ffffff" opacity="0.15"/>
  </g>

  <!-- Measuring Protein Scoop in Foreground -->
  <g filter="url(#shadow)" transform="translate(180, 85)">
    <!-- Scoop Handle -->
    <rect x="40" y="25" width="65" height="8" rx="3" fill="#059669" stroke="#047857" stroke-width="1" transform="rotate(-15 40 25)"/>
    <!-- Scoop Bowl -->
    <path d="M 10,20 L 45,20 C 45,45 10,45 10,20 Z" fill="#059669" stroke="#047857" stroke-width="1.2"/>
    <!-- Powder Mound inside scoop -->
    <path d="M 10,20 Q 28,10 45,20 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Floating Supplement Capsule -->
    <g transform="translate(25, 45) rotate(35)">
      <rect x="0" y="0" width="36" height="16" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <rect x="18" y="0" width="18" height="16" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
    </g>
  </g>
</svg>
