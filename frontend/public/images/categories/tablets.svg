<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="blister" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="pill-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pill-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pill-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-tab)"/>

  <!-- Blister Pack Background -->
  <g filter="url(#shadow)">
    <rect x="50" y="35" width="130" height="130" rx="12" fill="url(#blister)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Blister grid lines -->
    <line x1="115" y1="35" x2="115" y2="165" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="50" y1="100" x2="180" y2="100" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- 4 Blister pockets -->
    <ellipse cx="82" cy="68" rx="20" ry="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="82" cy="68" r="15" fill="url(#pill-white)" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="72" y1="68" x2="92" y2="68" stroke="#cbd5e1" stroke-width="1.5"/>

    <ellipse cx="148" cy="68" rx="20" ry="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="148" cy="68" r="15" fill="url(#pill-emerald)" stroke="#047857" stroke-width="0.8"/>
    <path d="M148 62 L148 74 M142 68 L154 68" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

    <ellipse cx="82" cy="132" rx="20" ry="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="82" cy="132" r="15" fill="url(#pill-white)" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="82" y1="122" x2="82" y2="142" stroke="#cbd5e1" stroke-width="1.5"/>

    <ellipse cx="148" cy="132" rx="20" ry="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="148" cy="132" r="15" fill="url(#pill-blue)" stroke="#0369a1" stroke-width="0.8"/>
    <line x1="138" y1="132" x2="158" y2="132" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Large Foreground Floating Tablets -->
  <g filter="url(#shadow)" transform="rotate(-15 220 100)">
    <!-- Round Large Tablet -->
    <circle cx="215" cy="85" r="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="215" cy="85" r="23" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <line x1="200" y1="85" x2="230" y2="85" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="215" cy="73" r="2" fill="#38bdf8"/>

    <!-- Oval Caplet -->
    <rect x="190" y="125" width="65" height="30" rx="15" fill="url(#pill-emerald)" stroke="#047857" stroke-width="1.5"/>
    <line x1="222.5" y1="125" x2="222.5" y2="155" stroke="#065f46" stroke-width="1.5"/>
    <circle cx="206" cy="140" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="239" cy="140" r="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Sparkles -->
  <path d="M260 45 L263 52 L270 55 L263 58 L260 65 L257 58 L250 55 L257 52 Z" fill="#10b981" opacity="0.7"/>
  <path d="M40 90 L42 95 L47 97 L42 99 L40 104 L38 99 L33 97 L38 95 Z" fill="#38bdf8" opacity="0.6"/>
</svg>
