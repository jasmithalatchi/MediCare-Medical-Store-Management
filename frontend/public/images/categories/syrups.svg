<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-syr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="amber-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="silver-spoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-syr)"/>

  <!-- Amber Syrup Bottle -->
  <g filter="url(#shadow)" transform="translate(65, 20)">
    <!-- White Cap -->
    <rect x="26" y="0" width="38" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="32" y1="4" x2="32" y2="14" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="38" y1="4" x2="38" y2="14" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="44" y1="4" x2="44" y2="14" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="50" y1="4" x2="50" y2="14" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="56" y1="4" x2="56" y2="14" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Bottle Neck -->
    <rect x="32" y="18" width="26" height="14" fill="#b45309" stroke="#78350f" stroke-width="1"/>

    <!-- Bottle Body -->
    <rect x="10" y="32" width="70" height="125" rx="14" fill="url(#amber-glass)" stroke="#78350f" stroke-width="1.5"/>

    <!-- Liquid inside reflection -->
    <rect x="14" y="55" width="62" height="98" rx="10" fill="url(#liquid)" opacity="0.6"/>

    <!-- Label -->
    <rect x="15" y="65" width="60" height="60" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Medical Cross on label -->
    <rect x="39" y="75" width="12" height="24" rx="2" fill="#ef4444"/>
    <rect x="33" y="81" width="24" height="12" rx="2" fill="#ef4444"/>
    <rect x="22" y="105" width="46" height="4" rx="2" fill="#94a3b8"/>
    <rect x="28" y="113" width="34" height="3" rx="1.5" fill="#cbd5e1"/>

    <!-- Glass gloss highlight -->
    <path d="M 16,40 L 22,40 L 22,150 L 16,145 Z" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Measuring Spoon with Syrup -->
  <g filter="url(#shadow)" transform="translate(160, 95)">
    <!-- Spoon Handle -->
    <path d="M 120,40 C 90,35 60,30 45,26 L 43,34 C 60,38 90,43 120,46 Z" fill="url(#silver-spoon)"/>
    <!-- Spoon Bowl -->
    <ellipse cx="28" cy="28" rx="28" ry="18" fill="url(#silver-spoon)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Syrup inside spoon bowl -->
    <ellipse cx="28" cy="29" rx="23" ry="14" fill="url(#liquid)"/>
    <ellipse cx="24" cy="26" rx="12" ry="4" fill="#fef08a" opacity="0.7"/>

    <!-- Dripping Drop from spoon -->
    <path d="M 28,45 C 28,45 20,60 20,68 C 20,74 24,78 28,78 C 32,78 36,74 36,68 C 36,60 28,45 28,45 Z" fill="url(#liquid)"/>
    <ellipse cx="26" cy="68" rx="3" ry="6" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Falling Drop -->
  <path d="M 140,48 C 140,48 135,58 135,63 C 135,66 137,68 140,68 C 143,68 145,66 145,63 C 145,58 140,48 140,48 Z" fill="#f59e0b"/>
</svg>
