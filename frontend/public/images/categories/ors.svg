<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ors" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="ors-sachet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="drink-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-ors)"/>

  <!-- WHO Standard ORS Sachet Left -->
  <g filter="url(#shadow)" transform="translate(50, 30) rotate(-10)">
    <!-- Foil Sachet Packet -->
    <rect x="0" y="0" width="95" height="135" rx="6" fill="url(#ors-sachet)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Crimped Edges -->
    <line x1="0" y1="8" x2="95" y2="8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="0" y1="127" x2="95" y2="127" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Bold Orange Banner -->
    <rect x="6" y="18" width="83" height="42" rx="4" fill="#f97316"/>
    <text x="47" y="44" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ORS</text>
    <text x="47" y="55" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#ffedd5" text-anchor="middle">WHO FORMULA</text>

    <!-- Electrolyte Details -->
    <rect x="12" y="70" width="70" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="78" width="55" height="3" rx="1.5" fill="#94a3b8"/>
    <rect x="12" y="85" width="65" height="3" rx="1.5" fill="#cbd5e1"/>

    <!-- Zinc Enriched Seal -->
    <circle cx="47" cy="106" r="12" fill="#0284c7"/>
    <text x="47" y="109.5" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Zn</text>
  </g>

  <!-- Refreshing Hydration Glass Right -->
  <g filter="url(#shadow)" transform="translate(170, 30)">
    <!-- Glass Shape -->
    <polygon points="20,20 80,20 70,145 30,145" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" opacity="0.9"/>
    <!-- Orange Electrolyte Liquid inside -->
    <polygon points="24,40 76,40 68,142 32,142" fill="url(#drink-liquid)" opacity="0.85"/>
    <ellipse cx="50" cy="40" rx="26" ry="6" fill="#fdba74"/>

    <!-- Ice Cubes inside -->
    <rect x="36" y="60" width="18" height="18" rx="3" fill="#ffffff" opacity="0.6" stroke="#fed7aa" stroke-width="0.8" transform="rotate(15 45 69)"/>
    <rect x="48" y="90" width="16" height="16" rx="3" fill="#ffffff" opacity="0.6" stroke="#fed7aa" stroke-width="0.8" transform="rotate(-10 56 98)"/>

    <!-- Lemon Wedge on Rim -->
    <path d="M 12,25 A 20,20 0 0,1 32,5 Z" fill="#eab308" stroke="#ca8a04" stroke-width="1.2"/>
    <path d="M 15,22 A 16,16 0 0,1 29,8 Z" fill="#fef08a"/>

    <!-- Bubbles Rising -->
    <circle cx="42" cy="120" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="58" cy="110" r="3.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="46" cy="75" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="54" cy="52" r="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Energy Wave -->
  <path d="M 270,140 Q 285,125 300,140" stroke="#f97316" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
