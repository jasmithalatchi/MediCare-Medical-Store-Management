<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-fa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="kit-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="bandage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="16" fill="url(#bg-fa)"/>

  <!-- Emergency First Aid Kit Box -->
  <g filter="url(#shadow)" transform="translate(60, 30)">
    <!-- Kit Handle -->
    <path d="M 45,0 L 75,0 C 80,0 80,15 80,15 L 40,15 C 40,15 40,0 45,0 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="50" y="4" width="20" height="7" rx="2" fill="#f1f5f9"/>

    <!-- Kit Case -->
    <rect x="0" y="15" width="120" height="120" rx="16" fill="url(#kit-red)" stroke="#b91c1c" stroke-width="1.5"/>

    <!-- Case Latches -->
    <rect x="22" y="13" width="12" height="8" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="86" y="13" width="12" height="8" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Center White Badge with Medical Cross -->
    <circle cx="60" cy="75" r="32" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
    <!-- Red Cross -->
    <rect x="52" y="55" width="16" height="40" rx="3" fill="#ef4444"/>
    <rect x="40" y="67" width="40" height="16" rx="3" fill="#ef4444"/>
  </g>

  <!-- Crossed Sterile Bandages Right -->
  <g filter="url(#shadow)" transform="translate(195, 65)">
    <!-- Bandage 1 (rotated -30) -->
    <g transform="rotate(-30 45 45)">
      <rect x="0" y="32" width="90" height="26" rx="13" fill="url(#bandage)" stroke="#fb923c" stroke-width="1"/>
      <rect x="30" y="32" width="30" height="26" fill="#ffedd5"/>
      <!-- Perforation dots -->
      <circle cx="12" cy="45" r="1.5" fill="#ea580c" opacity="0.6"/>
      <circle cx="20" cy="45" r="1.5" fill="#ea580c" opacity="0.6"/>
      <circle cx="70" cy="45" r="1.5" fill="#ea580c" opacity="0.6"/>
      <circle cx="78" cy="45" r="1.5" fill="#ea580c" opacity="0.6"/>
    </g>

    <!-- Bandage 2 (rotated 30) -->
    <g transform="rotate(30 45 45)">
      <rect x="0" y="32" width="90" height="26" rx="13" fill="url(#bandage)" stroke="#fb923c" stroke-width="1"/>
      <rect x="30" y="32" width="30" height="26" fill="#ffedd5"/>
      <circle cx="12" cy="45" r="1.5" fill="#ea580c" opacity="0.6"/>
      <circle cx="20" cy="45" r="1.5" fill="#ea580c" opacity="0.6"/>
      <circle cx="70" cy="45" r="1.5" fill="#ea580c" opacity="0.6"/>
      <circle cx="78" cy="45" r="1.5" fill="#ea580c" opacity="0.6"/>
    </g>
  </g>

  <!-- Thermometer Tip in Background -->
  <g transform="translate(35, 120) rotate(45)" opacity="0.5">
    <rect x="0" y="0" width="8" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="4" cy="45" r="6" fill="#ef4444"/>
    <line x1="4" y1="20" x2="4" y2="45" stroke="#ef4444" stroke-width="2"/>
  </g>
</svg>
